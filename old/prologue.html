<!doctype html>
<canvas id=a width=720 height=720></canvas>
<style>
canvas { border: 2px solid; background: #000; }
</style>
<script>
c = a.getContext("2d");
c.fillStyle = "#fff";
c.textAlign = "center";
c.font = "bold 50px Calibri, sans-serif";
c.fillText("click to start", 360, 360);

// piano
play=((e,t)=>{for(b=((e,t,i,a)=>Math.sin(e/t*6.28*i+a)),w=((e,t)=>Math.sin(e/44100*t*6.28+b(e,44100,t,0)**2+.75*b(e,44100,t,.25)+.1*b(e,44100,t,.5))),D=[],i=0;i<44100*t;i++)D[i]=i<88?i/88.2*w(i,e):(1-(i-88.2)/(44100*(t-.002)))**((.5*Math.log(1e4*e/44100))**2)*w(i,e);A=new AudioContext,m=A.createBuffer(1,1e6,44100),m.getChannelData(0).set(D),s=A.createBufferSource(),s.buffer=m,s.connect(A.destination),s.start()})

type = (str, x, y, speed) => {
  window.str = str;
  window.x = x;
  window.y = y;
  for(i = 0; i <= str.length; i++){
    setTimeout("c.clearRect(x-30, y-30, 640,30); c.fillText(str.slice(0,"+i+"), x, y);", speed*i);
  }
}

intro2 = () => {
  a.width ^= 0;
  c.fillStyle = "#fff";
  c.textAlign = "left";
  c.font = "bold 30px Calibri, sans-serif";
  
  type("xem:", 20, 200, 30);
  play(100, .2);
  setTimeout(() => {
    type("I wish there was a \"fun\" category...", 20, 230, 30);
    //play(200, .2);
  }, 1000);
  
  setTimeout(() => {
    type("end3r:", 20, 300, 30);
    play(100, .2);
  }, 3000);
  
  setTimeout(() => {
    type("FUN? WHAT NEXT? Do you think we should have", 20, 330, 30);
    //play(200, .2);
  }, 3500);
  
  setTimeout(() => {
    type("\"rainbows and unicorns\" as the theme next year?!", 20, 360, 30);
  }, 5700);
  
  setTimeout(() => {
    type("xem:", 20, 450, 30);
    play(100, .2);
  }, 8000);
  
  setTimeout(() => {
    type("2026 theme will totally be unicorns and rainbows.", 20, 480, 30);
    //play(200, .2);
  }, 8500);
  
  setTimeout(() => {
    type("Remember it, folks!", 20, 510, 30);
  }, 10500);
  
  setTimeout(() => {
    location = "index.html";
  }, 15000);
}

}

</script>
