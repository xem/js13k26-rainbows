<!doctype html>
<link rel=stylesheet href=style.css>
<script src=helpers.js></script>
<script src=svg.js></script>
<script src=story.js></script>
<div id=sky1></div>
<div id=sky2></div>
<div id=sun style=opacity:0></div>
<canvas width=720 height=405 id=e></canvas>
<canvas width=720 height=405 id=a></canvas>
<canvas width=720 height=405 id=b></canvas>
<div id=ok>OK</div>
<div id=text2>Unicorny's island had become a desert...</div>
<div id=fade></div>
<canvas id=tmp width=720 height=405 style="top:405px;display:none"></canvas>
<script>
// drawings
drawings = {};
paths = [[]];

patches = [];
for(i = 0; i < 100; i++){
  patches.push({x:1400+Math.random()*1800, y: 250+Math.random() * 160});
}

// game loop
onload = () => {

  // tmp
  imgsun = createDrawing();

  c=a.getContext("2d"); // board, path
  d=b.getContext("2d"); // crayon / instructions / ok
  f=e.getContext("2d"); // game, drawings
  
  // start animations
  start();
  
  // loop
  setInterval(()=>{
  
    // count frames, scroll
    frame++;
    if(scrolling) scroll++;
 
    // disable cursor when a crayon is visible
    if(b.style.opacity == 1) b.style.cursor = "none";
    else b.style.cursor = "pointer";
    
    // unicorn head offset Y
    uoffsety = 190 + (Math.cos(scroll/10) * 15);
    
    // reset game canvas
    e.width ^= 0; 
    
    // draw:
    
    // ground
    f.beginPath();
    if(story < 7){
      f.fillStyle = "rgb(30,30,30)";
    }
    if(story >= 7){
      if(frame < 200) {
        //console.log((40-(200 - frame))/40, lerpRGB("rgb(30,30,30)","rgb(100,221,72)", (40-(200 - frame))/40));
        f.fillStyle = lerpRGB("rgb(30,30,30)","rgb(52,89,13)", (40-(200 - frame))/40);
      }
      else {
        f.fillStyle = "rgb(52,89,13)";
      }
    }
    
    f.arc(360,1750,1500, 0, 7);
    f.fill();
    f.closePath();
    
    // dead tree
    f.font = "150px emoji";
    f.save();
    if(story < 4) f.filter = "brightness(5%)";
    f.translate(1080 - scroll * 3,260);
    f.scale(1.5,1.5);
    f.fillText("🪾", 0, 0);
    f.restore();
    var d, realx;
    
    // all the grass
    if(story == 7){
      for(var i of patches){
        f.save();
        realx = i.x - scroll * 3;
        d = Math.abs(realx - 260) / 260;
        f.translate(
          realx,
          i.y - Math.cos(d) * 40
        );
        f.scale(.2, .2);
        f.globalAplha = 0;
        if(frame < 200){
          //console.log(frame, (40-(200 - frame))/40);
          f.globalAlpha = (40-(200 - frame))/40;
        }
        f.drawImage(imgpatch, 0, 0);
        f.restore();
      }
    }
    
    // froggy
    if(story >= 4){
      f.font = "80px emoji";
      f.save();
      f.translate(2000 - scroll * 3,280);
      f.scale(3, 3);
      f.drawImage(imgfrogbody, -38, -45);
      f.restore();
      f.save();
      f.translate(2000 - scroll * 3,260);
      f.scale(1,1);
      f.fillText("🐸", -10, 40);
      f.restore();
      
    }
    
    // yellow crayon (in game)
    f.save();
    f.translate(1500-scroll*3,220);
    f.scale(1, 1);
    if(story < 3){
      f.drawImage(yellow, 0, 0);
    }
    if(story == 3){
      f.rotate(frame < 50 ? (frame/50 * .5) : .5); 
      if(frame < 50){
        f.drawImage(yellow, 0, 0 - ((frame < 50) ? (frame * 4) : 200));
      }
      else if(frame < 100){
        f.drawImage(yellow, 0 + Math.random() * 15, -200 + Math.random() * 15);
      }
      else if(frame < 150){
        f.drawImage(yellow, 0, -200 - ((frame-100) * 6));
      }
    }
    f.restore();
    
    // green crayon (in game)
    f.save();
    f.translate(2170-scroll*3,220);
    f.scale(1, 1);
    if(story < 6){
      f.drawImage(green, 0, 0);
    }
    if(story == 6){
      f.rotate(frame < 50 ? (frame/50 * -.85) : -.85); 
      if(frame < 50){
        f.drawImage(green, 0 - ((frame < 50) ? (frame * 4) : 200), 0);
      }
      else if(frame < 100){
        f.drawImage(green, -230 + Math.random() * 15, 0 + Math.random() * 15);
      }
      else if(frame < 150){
        f.drawImage(green, -230, 0 + ((frame-100) * 6));
      }
    }
    f.restore();
    
    // rain
    if(story <= 3){
      f.beginPath();
      f.lineWidth = 4;
      f.strokeStyle = "#346";
      for(i = 30; i--;){
        f.moveTo(x = Math.random()*720, y = Math.random()*405)
        f.lineTo(x-5,y+20);
      }
      f.stroke();
      f.closePath();
    }
    
    // sun
    if(story >= 3){
      f.save();
      f.translate(450,10);
      f.scale(.5, .5);
      if(story == 3){
        if(frame > 50){
          f.globalAlpha = ((frame < 150) ? ((frame - 50) / 110) : 1);
          f.drawImage(imgsun, 30, -90);
        }
      }
      else {
        f.drawImage(imgsun, 30, -90);
      }
      f.restore();
    }
    
    // grass
    if(story >= 6){
      f.save();
      f.translate(1850-scroll*3,270);
      f.scale(.4, .4);
      if(story == 6){
        if(frame > 50){
          //console.log(frame, ((frame < 150) ? ((frame - 50) / 100) : 1));
          f.globalAlpha = ((frame < 150) ? ((frame - 50) / 100) : 1);
          f.drawImage(imgpatch, 140, -20);
        }
      }
      else {
        f.drawImage(imgpatch, 140, -20);
      }
      f.restore();
    }
    
    // unicorn head
    f.font = "150px emoji";
    f.save();
    f.translate(196+uoffsetx,200+uoffsety);
    f.scale(-1.2,1.2);
    if(story < 4) f.filter = "brightness(45%)";
    f.fillText("🦄", 0, 0+ Math.sin(frame/20)*4);
    f.restore();
    
    // emotions:
    // sad
    if(story == 0){
      // sad
      f.save();
      f.translate(131+uoffsetx,160+uoffsety);
      f.scale(1,1);
      if(story < 4) f.filter = "brightness(45%)";
      f.drawImage(imgmouth, -14, -10+ Math.sin(frame/20)*4);
      f.drawImage(imgfrown, -42, -53+ Math.sin(frame/20)*4);
      f.restore();
    }
    
    // surprised
    if(story == 1){
      f.save();
      f.translate(131+uoffsetx,160+uoffsety);
      f.scale(1,1);
      if(story < 4) f.filter = "brightness(45%)";
      f.drawImage(imgmoutho, -14, -10+ Math.sin(frame/20)*4);
      f.drawImage(imgfrown, -42, -58+ Math.sin(frame/20)*4);
      f.restore();
    }
    
    // story progress:
    // 3 => 4
    if(story == 3 && frame == 150){
      setTimeout(()=>{story = 4; story4();}, 2000);
      sky2.style.opacity = 0;
      sun.style.opacity = .5;
    }
    
    // 6 => 7
    if(story == 6 && frame == 100){
      setTimeout(()=>{story = 7; story7();}, 2000);
    }
    
    
  }, 33);
  
  
}

// draw with mouse
onmousemove = (e) => {
  if(!window["c"]) return;
  b.width ^= 0;
  var x = e.pageX;
  var y = e.pageY;
  
  c.beginPath();
  c.rect(100+5, 50+5, 500-10, 300-10);
  c.closePath();
  
  // yellow path
  if(mousedown && story == 2){
    if(c.isPointInPath(x, y)){
      paths[paths.length - 1].push({x,y});
      currentpath = paths[paths.length-1];
      if(currentpath.length > 1){
        drawCrayon(
          currentpath[currentpath.length - 2].x,
          currentpath[currentpath.length - 2].y,
          currentpath[currentpath.length - 1].x,
          currentpath[currentpath.length - 1].y,
          15,
          "#e4cb07"
        );
      }
    }
    else{
      if(paths[paths.length-1].length > 0)
        paths.push([]);
    }
    if(paths.flat().length > 50){
      ok.style.opacity = 1;
    }
  }
  
  // green path
  if(mousedown && story == 5){
    if(c.isPointInPath(x, y)){
      paths[paths.length - 1].push({x,y});
      currentpath = paths[paths.length-1];
      if(currentpath.length > 1){
        drawCrayon(
          currentpath[currentpath.length - 2].x,
          currentpath[currentpath.length - 2].y,
          currentpath[currentpath.length - 1].x,
          currentpath[currentpath.length - 1].y,
          15,
          "green"
        );
      }
    }
    else{
      if(paths[paths.length-1].length > 0)
        paths.push([]);
    }
    if(paths.flat().length > 50){
      ok.style.opacity = 1;
    }
  }

  // yellow crayon (over the board)
  if(story == 2){
    d.font = "20px Calibri, sans-serif";
    d.fillStyle = "#fff";
    d.save();
    d.translate(x,y);
    d.rotate(-.2);
    d.scale(.9, .9);
    d.drawImage(yellow, -30, -10);
    d.restore();
  }
  
  // green crayon (over the board)
  if(story == 5){
    d.font = "20px Calibri, sans-serif";
    d.fillStyle = "#fff";
    d.save();
    d.translate(x,y);
    d.rotate(-.2);
    d.scale(.9, .9);
    d.drawImage(green, -30, -10);
    d.restore();
  }
  
}

// mouse events
mousedown = 0;
onmousedown = () => { 
  mousedown = 1;
  if(paths[paths.length-1].length > 0)
    paths.push([]);
}
onmouseup = () => mousedown = 0;

// ok button
ok.onclick = () => {
  if(paths.flat().length > 50){
  
    // sun
    if(story == 2){
      imgsun = createDrawing(paths);
      a.style.top = "-405px";
      story = 3;
      frame = 0;
      ok.style.opacity = 0;
    }
    
    // grass
    if(story == 5){
      imgpatch = createDrawing(paths, "green");
      a.style.top = "-405px";
      story = 6;
      frame = 0;
      ok.style.opacity = 0;
    }
  }
}


</script>
