<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MiniSoundEditor – 45 sons</title>

<style>
    body {
        font-family: sans-serif;
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
        background: #fafafa;
    }

    h1 {
        margin-bottom: 5px;
    }

    section {
        background: white;
        padding: 20px;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px #0001;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    button {
        border: 1px solid #bbb;
        background: #eee;
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #ddd;
    }

    button.active {
        background: #222;
        color: white;
    }

    pre {
        margin-top: 15px;
        padding: 15px;
        background: #171717;
        color: #eee;
        overflow-x: auto;
        border-radius: 6px;
        display: none;
    }

    pre.visible {
        display: block;
    }
</style>
</head>

<body>

<h1>MiniSoundEditor – 45 nouveaux sons</h1>
<p>Clique sur un bouton pour jouer le son et afficher son code.</p>

<div id="app"></div>

<script>

/* ============================================================
   PLAYER
   ============================================================ */

let audioContext;
let currentSource;

function play(f, reverse = false, duration = 2) {

    audioContext ??= new AudioContext();

    if (audioContext.state === "suspended")
        audioContext.resume();

    if (currentSource) {
        try {
            currentSource.stop();
        } catch {}
    }

    const N = duration * 48000;

    const buffer = audioContext.createBuffer(
        1,
        N,
        48000
    );

    const data = buffer.getChannelData(0);

    for (let i = N; i--;) {
        const x = reverse ? N - i : i;
        data[i] = f(x);
    }

    const source = audioContext.createBufferSource();

    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();

    currentSource = source;
}


/* ============================================================
   HELPERS
   ============================================================ */

const t = (i,n) => (n-i)/n;

const noise = i => {

    i = (i * 16807) | 0;

    i = (i ^ (i >>> 7)) * 48271;

    return ((i & 65535) / 32768) - 1;
};

const clamp = x =>
    Math.max(-1, Math.min(1, x));


/* ============================================================
   CRAYON
   ============================================================ */

const crayon1 = i => {

    const n = 40000;

    return (
        noise(i * 17) * .25 +
        Math.sin(i / 4) * .04 +
        Math.sin(i / 13) * .08
    ) * t(i,n) * .5;
};


const crayon2 = i => {

    const n = 42000;

    return (
        noise(i * 7) * .35 +
        Math.sin(i / 8) * .07
    ) * t(i,n) * .45;
};


const crayon3 = i => {

    const n = 36000;

    return (
        noise(i * 31) * .28 +
        Math.sin(i / 3.7) * .035 +
        Math.sin(i / 19) * .1
    ) * t(i,n) * .5;
};


const crayon4 = i => {

    const n = 45000;

    const pressure =
        .4 +
        .6 * Math.sin(i / 700) ** 2;

    return (
        noise(i * 11) * .3 +
        Math.sin(i / 5) * .06
    ) * pressure * t(i,n) * .45;
};


const crayon5 = i => {

    const n = 40000;

    return (
        noise(i * 3) * .32 +
        noise(i * 71) * .12 +
        Math.sin(i / 17) * .05
    ) * t(i,n) * .5;
};


/* ============================================================
   GRENOUILLE
   ============================================================ */

const grenouille1 = i => {

    const n = 30000;
    const f = 100 + i * .002;

    return Math.sin(i * f / 48000 * Math.PI * 2)
        * Math.sin(i / 800)
        * t(i,n) * .7;
};


const grenouille2 = i => {

    const n = 28000;
    const f = 120 + Math.sin(i / 200) * 25;

    return Math.sin(i * f / 48000 * Math.PI * 2)
        * Math.sin(i / 500)
        * t(i,n) * .65;
};


const grenouille3 = i => {

    const n = 26000;
    const f = 180 - i * .003;

    return Math.sin(i * f / 48000 * Math.PI * 2)
        * Math.sin(i / 47)
        * t(i,n) * .6;
};


const grenouille4 = i => {

    const n = 30000;

    return (
        Math.sin(i / 500) *
        Math.sin(i / 48000 * Math.PI * 2 * 90)
        +
        noise(i) * .15
    ) * t(i,n) * .7;
};


const grenouille5 = i => {

    const n = 32000;
    const f = 80 + 30 * Math.sin(i / 600);

    return (
        Math.sin(i * f / 48000 * Math.PI * 2) +
        Math.sin(i * f * 1.5 / 48000 * Math.PI * 2) * .4
    ) * Math.sin(i / 700) * t(i,n) * .7;
};


/* ============================================================
   PAS DANS L'HERBE
   ============================================================ */

const herbe1 = i => {

    const n = 50000;

    const step =
        Math.max(0, Math.sin(i / 140)) ** 18;

    return noise(i * 13) * step * t(i,n) * .8;
};


const herbe2 = i => {

    const n = 52000;

    const step =
        Math.max(0, Math.sin(i / 160)) ** 22;

    return (
        noise(i * 7) * .6 +
        Math.sin(i / 5) * .04
    ) * step * t(i,n);
};


const herbe3 = i => {

    const n = 60000;

    const a =
        Math.max(0, Math.sin(i / 170)) ** 20;

    const b =
        Math.max(0, Math.sin(i / 170 + 2.7)) ** 20;

    return noise(i * 3) * (a+b) * t(i,n) * .7;
};


const herbe4 = i => {

    const n = 48000;

    const step =
        Math.max(0, Math.sin(i / 125)) ** 25;

    const rustle =
        noise(i * 17) *
        Math.sin(i / 13) ** 2;

    return (
        step * noise(i * 2) +
        rustle * .15
    ) * t(i,n);
};


const herbe5 = i => {

    const n = 55000;

    const a =
        Math.max(0, Math.sin(i / 180)) ** 19;

    const b =
        Math.max(0, Math.sin(i / 180 + 3)) ** 19;

    return (
        noise(i * 11) * (a+b)
    ) * t(i,n) * .8;
};


/* ============================================================
   BULLES
   ============================================================ */

const bulles1 = i => {

    const n = 40000;

    const x = i % 4000;

    const bubble =
        Math.exp(-x*x/7000);

    return Math.sin(
        i / 48000 * Math.PI * 2 *
        (600 + x * .8)
    ) * bubble * t(i,n) * .7;
};


const bulles2 = i => {

    const n = 40000;

    const x = i % 5000;

    return (
        Math.sin(i / 8) +
        Math.sin(i / 13)
    ) * Math.exp(-x*x/5000)
      * t(i,n) * .12;
};


const bulles3 = i => {

    const n = 35000;

    const x = i % 3200;

    const f =
        400 + 1500 * Math.exp(-x / 500);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.exp(-x*x/3000)
      * t(i,n) * .7;
};


const bulles4 = i => {

    const n = 45000;

    const x = i % 6000;

    return (
        Math.sin(i / 11) * .15 +
        Math.sin(i / 27) * .2
    ) * Math.exp(-x*x/7000)
      * t(i,n);
};


const bulles5 = i => {

    const n = 42000;

    const x = i % 3600;

    const f =
        500 + 1800 * Math.exp(-x / 450);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.exp(-x*x/4000)
      * t(i,n) * .7;
};


/* ============================================================
   BATEAU
   ============================================================ */

const bateau1 = i => {

    const n = 96000;

    const moteur =
        Math.sin(i / 48000 * Math.PI * 2 * 65) * .5;

    const vagues =
        Math.sin(i / 1900) * .18 +
        Math.sin(i / 700) * .08;

    return (moteur + vagues) * t(i,n) * .5;
};


const bateau2 = i => {

    const n = 96000;

    return (
        Math.sin(i / 48000 * Math.PI * 2 * 48) * .6 +
        Math.sin(i / 340) * .1 +
        noise(i * 3) * .08
    ) * t(i,n) * .55;
};


const bateau3 = i => {

    const n = 96000;

    const moteur =
        Math.sin(i / 48000 * Math.PI * 2 *
        (58 + Math.sin(i / 900) * 4)) * .5;

    const coque =
        Math.sin(i / 1500) * .18;

    return (
        moteur + coque + noise(i) * .06
    ) * t(i,n) * .5;
};


const bateau4 = i => {

    const n = 96000;

    const moteur =
        Math.sin(i / 48000 * Math.PI * 2 * 72) *
        (.3 + .25 * Math.sin(i / 2600) ** 2);

    const eau =
        noise(i * 5) *
        Math.max(0,Math.sin(i / 480));

    return (moteur + eau * .12) * t(i,n);
};


const bateau5 = i => {

    const n = 100000;

    const moteur =
        Math.sin(i / 48000 * Math.PI * 2 * 61) * .5 +
        Math.sin(i / 48000 * Math.PI * 2 * 122) * .15;

    const vagues =
        Math.sin(i / 2100) * .2 +
        Math.sin(i / 530) * .06;

    return (
        moteur + vagues
    ) * (.5 + .5 * Math.sin(i / 3000) ** 2)
      * t(i,n) * .5;
};


/* ============================================================
   POUSSIN
   ============================================================ */

const poussin1 = i => {

    const n = 25000;

    const f = 700 + i * .02;

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.min(1,i/700)
      * t(i,n) * .6;
};


const poussin2 = i => {

    const n = 27000;

    const f = 1100 - i * .012;

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.min(1,i/500)
      * t(i,n) * .6;
};


const poussin3 = i => {

    const n = 25000;

    const f = 850 + 170 * Math.sin(i / 180);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.sin(i / 61)
      * t(i,n) * .7;
};


const poussin4 = i => {

    const n = 30000;

    const f = 950 - i * .01;

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        noise(i) * .05
    ) * Math.min(1,i/900)
      * t(i,n) * .6;
};


const poussin5 = i => {

    const n = 28000;

    const f =
        650 + 500 * Math.exp(-i/6000);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.sin(i / 43)
      * t(i,n) * .6;
};


/* ============================================================
   OIE
   ============================================================ */

const oie1 = i => {

    const n = 45000;

    const f =
        260 + 40 * Math.sin(i / 900);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * (.6 + .4 * Math.sin(i / 31) ** 2)
      * Math.min(1,i/1500)
      * t(i,n) * .7;
};


const oie2 = i => {

    const n = 40000;

    const f = 310 - i * .004;

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(
            i / 48000 * Math.PI * f
        ) * .4
    ) * Math.min(1,i/1000)
      * t(i,n) * .6;
};


const oie3 = i => {

    const n = 46000;

    const f =
        230 + 65 * Math.sin(i / 700);

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        noise(i) * .1
    ) * Math.min(1,i/1500)
      * t(i,n) * .65;
};


const oie4 = i => {

    const n = 40000;

    const f = 280 + 100 * i/n;

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * Math.sin(i / 260)
      * Math.min(1,i/900)
      * t(i,n) * .75;
};


const oie5 = i => {

    const n = 50000;

    const f =
        210 + 35 * Math.sin(i / 430);

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(
            i / 48000 * Math.PI * 2 * f * 2.01
        ) * .3
    ) * Math.min(1,i/1500)
      * t(i,n) * .65;
};


/* ============================================================
   FLEUR QUI ÉCLOT
   ============================================================ */

const fleur1 = i => {

    const n = 65000;

    const p = i/n;

    const f =
        180 + 1100 * p*p;

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * p * t(i,n) * .45;
};


const fleur2 = i => {

    const n = 70000;

    const p = i/n;

    const f =
        220 + 900 * p**1.7;

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(i / 17) * .06
    ) * p * t(i,n) * .4;
};


const fleur3 = i => {

    const n = 72000;

    const p = i/n;

    const f =
        120 + 1500*p;

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(
            i / 48000 * Math.PI * 2 * f * 2.01
        ) * .15
    ) * Math.sin(i/3000)**2
      * t(i,n) * .45;
};


const fleur4 = i => {

    const n = 65000;

    const p = i/n;

    const f =
        300 + 700*p;

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(i/11) * p * .03
    ) * p * t(i,n) * .5;
};


const fleur5 = i => {

    const n = 75000;

    const p = i/n;

    const f =
        90 + 1300*Math.sqrt(p);

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * (
        .5 + .5*Math.sin(i/800)
    ) * p * t(i,n) * .45;
};


/* ============================================================
   SCINTILLEMENT
   ============================================================ */

const scintillement1 = i => {

    const n = 40000;

    const x = i % 2800;

    const hit =
        Math.exp(-x*x/1800);

    return Math.sin(
        i / 48000 * Math.PI * 2 *
        (1200 + 700*Math.exp(-x/500))
    ) * hit * t(i,n) * .6;
};


const scintillement2 = i => {

    const n = 50000;

    const sparkle =
        Math.max(0,Math.sin(i/37)) ** 18;

    return Math.sin(
        i / 48000 * Math.PI * 2 *
        (800 + 400*Math.sin(i/900))
    ) * sparkle * t(i,n) * .7;
};


const scintillement3 = i => {

    const n = 45000;

    const x = i % 3100;

    const hit =
        Math.exp(-x*x/2300);

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * 1800
        ) +
        Math.sin(
            i / 48000 * Math.PI * 2 * 2700
        ) * .3
    ) * hit * t(i,n) * .5;
};


const scintillement4 = i => {

    const n = 48000;

    const sparkle =
        Math.max(0,Math.sin(i/73)) ** 24;

    const f =
        600 + 1400*i/n;

    return Math.sin(
        i / 48000 * Math.PI * 2 * f
    ) * sparkle * t(i,n) * .75;
};


const scintillement5 = i => {

    const n = 55000;

    const sparkle =
        Math.max(0,Math.sin(i/51)) ** 30;

    const f =
        1000 + 1000*Math.sin(i/1200);

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * f
        ) +
        Math.sin(
            i / 48000 * Math.PI * 2 * f * 1.5
        ) * .25
    ) * sparkle * t(i,n) * .7;
};


/* ============================================================
   INTERFACE
   ============================================================ */

const themes = [

    ["✏️ Crayon sur une feuille",
     [crayon1,crayon2,crayon3,crayon4,crayon5]],

    ["🐸 Grenouille",
     [grenouille1,grenouille2,grenouille3,grenouille4,grenouille5]],

    ["🌿 Pas dans l'herbe",
     [herbe1,herbe2,herbe3,herbe4,herbe5]],

    ["🫧 Bulles",
     [bulles1,bulles2,bulles3,bulles4,bulles5]],

    ["⛵ Bateau qui navigue",
     [bateau1,bateau2,bateau3,bateau4,bateau5]],

    ["🐥 Poussin",
     [poussin1,poussin2,poussin3,poussin4,poussin5]],

    ["🪿 Oie",
     [oie1,oie2,oie3,oie4,oie5]],

    ["🌸 Fleur qui éclot",
     [fleur1,fleur2,fleur3,fleur4,fleur5]],

    ["✨ Scintillement",
     [scintillement1,scintillement2,scintillement3,scintillement4,scintillement5]]
];


for (const [name,sounds] of themes) {

    const section = document.createElement("section");

    const title = document.createElement("h2");
    title.textContent = name;

    const buttons = document.createElement("div");
    buttons.className = "buttons";

    const code = document.createElement("pre");

    section.append(title,buttons,code);

    sounds.forEach((sound,index) => {

        const button = document.createElement("button");

        button.textContent = `Son ${index+1}`;

        button.onclick = () => {

            document
                .querySelectorAll("button.active")
                .forEach(b => b.classList.remove("active"));

            document
                .querySelectorAll("pre.visible")
                .forEach(p => p.classList.remove("visible"));

            button.classList.add("active");

            play(sound);

            code.textContent = sound.toString();

            code.classList.add("visible");
        };

        buttons.appendChild(button);
    });

    document
        .getElementById("app")
        .appendChild(section);
}

</script>

</body>
</html>
