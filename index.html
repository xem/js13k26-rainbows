<script>

/* === GLOBALS === */
if(1){

  // retrieve from localstorage (tmp)
  imgsun = new Image(); imgsun.src = localStorage.unicorny_imgsun || "";
  imgpatch = new Image(); imgpatch.src = localStorage.unicorny_imgpatch || "";
  imgwaterfall = new Image(); imgwaterfall.src = localStorage.unicorny_imgwaterfall || "";
  imgboat = new Image(); imgboat.src = localStorage.unicorny_imgboat || "";
  imgapple = new Image(); imgapple.src = localStorage.unicorny_imgapple || "";
  imgflower = new Image(); imgflower.src = localStorage.unicorny_imgflower || "";
  imgrainbow = new Image(); imgrainbow.src = localStorage.unicorny_imgrainbow || "";
  
  // darkness
  dark = 0;

  // story number
  storynb = 1;

  // drawings
  drawings = {};
  paths = [[]];
  
  // Story 1 vars
  // ============
  
  // story steps
  // 0: text + scroll
  // 1: find yellow crayon
  // 2: draw the sun
  // 3: ok
  // 4: sun in the sky, text + scroll
  // 5: draw the grass
  // 6: ok
  // 7: grass, text, scroll
  story = 0;

  // unicorn head offset
  uoffsetx = -10;
  uoffsety = 190;

  // scroll x offset
  scroll = 0;
  scrolling = 1;

  frame = 0;

  //  grass patches
  patches = [];
  for(i = 0; i < 100; i++){
    patches.push({x:1400+Math.random()*1800, y: 250+Math.random() * 160});
  }
  
  // animation 1-4 frame counter
  story4_frame = 0;
  
  // story 2 vars
  // ============
  
  // story steps
  // 0: text
  // 1: draw waterfall
  // 2: waterfall done
  // 3: beavy arrives
  // 4: draw boat
  // 5: cruisin
  story2 = 0;
  
  // beaver position
  beavyX = 0;
  
  // unicorny offset x
  s2ox = -60;
  
  // Story 3 vars
  // ============
  
  // story steps:
  // 0: text
  // 1: draw apple
  // 2: apple ok
  // 3: draw flower
  // 4: flower ok
  // 5: go to mom
  // 6: draw rainbow
  // 7: end
  story3 = 0;

  // flowers
  flowers = [{x:559,y:299},{x:602,y:329},{x:215,y:302},{x:335,y:309},{x:513,y:269},{x:675,y:305},{x:130,y:250}];

  // girafe head Y offset
  ghY = 0;
  
  // scene Y offset
  s3oy = 15;
  
  // ending
  // ======
  
  ending = 0;
  zoom = 40;
  
}

/* === MUSIC === */
if(1){
  A = new AudioContext();
  ramp = 1;
  playpiano = (e,t,b,w,D,j,m,s) => {
    if(!e) return;
    for(
      b = ((e,t,i,a) => Math.sin(e/t*6.28*i+a)),
      w = ((e,t) => Math.sin(
        e/44100*t*6.28 +
        b(e,44100,t,0)**2 +
        .75*b(e,44100,t,.25) +
        .1*b(e,44100,t,.5)
      )),
      D = [],
      j = 0;
      j < 44100*t;
      j++
    )
      D[j] =
        (j < 88
        ? j/88.2*w(j,e)
        : (1-(j-88.2)/(44100*(t-.002)))**
          ((.5*Math.log(1e4*e/44100))**2)*w(j,e)) / 20;

    m = A.createBuffer(1,1e6,44100);
    m.getChannelData(0).set(D);

    s = A.createBufferSource();
    s.buffer = m;
    s.connect(A.destination);
    s.start();
  };

  N = {
    C4:261.63,D4:293.66,E4:329.63,F4:349.23,
    G4:392,A4:440,B4:493.88,
    C5:523.25,D5:587.33,E5:659.25,F5:698.46,
    G5:783.99,A5:880
  };

  melodies = [

    // ambiance
    [

      N.E4,N.G4,N.C5,N.G4,
      N.E4,N.G4,N.D5,N.C5,

      N.A4,N.C5,N.E5,N.C5,
      N.G4,N.B4,N.D5,N.B4,

      N.E4,N.G4,N.C5,N.E5,
      N.D5,N.C5,N.G4,N.E4,

      N.F4,N.A4,N.C5,N.A4,
      N.G4,N.B4,N.D5,N.G5,

      N.E5,N.D5,N.C5,0,
      
      
      N.C5,N.C5,N.E5,N.G5,
      N.E5,N.D5,N.C5,0,
      N.G4,N.G4,N.B4,N.D5,
      N.B4,N.A4,N.G4,0,

      N.A4,N.C5,N.E5,N.A5,
      N.G5,N.E5,N.C5,0,
      N.F5,N.E5,N.D5,N.G5,
      N.E5,N.D5,N.C5,0,
      
      
      N.E5,N.G5,N.E5,N.C5,
      N.D5,N.E5,N.G5,0,
      N.A5,N.G5,N.E5,N.D5,
      N.C5,N.E5,N.G5,0,

      N.E5,N.D5,N.C5,N.G4,
      N.A4,N.C5,N.E5,0,
      N.G5,N.E5,N.D5,N.C5,
      N.C5,0,
    

    ],[]
  ];

  timer = 0;
  note = 0;
  notes = melodies[0];
  melodynb = 1;

  togglesound = () => { note = 0; musique(melodynb = 1-melodynb); toggle.innerHTML = ["🔊","🔈"][melodynb]; }

  musique = (n) => {
    clearTimeout(timer);

    notes = melodies[n];
    note = 0;

    next = () => {
      if(dark && ramp < 6) { ramp = 6; }
      if(!dark && ramp > 1) { ramp = 1; }
      
      if (notes[note])
        playpiano(notes[note] / ramp, .9 + ramp/6);

      note = (note + 1) % notes.length;

      timer = setTimeout(next, 500 + ramp * 20);
    }

    next();
  }
}

/* === HELPERS === */
if(1){

  // CSS3D framework
  C = {
    unit: "px",
    camX: 0,
    camY: 0,
    camZ: 0,
    camRX: 0,
    camRY: 0,
    camRZ: 0,
    sprite_count: 0,
    sprites: [],
    plane_count: 0,
    cube_count: 0,
    pyramid_count: 0,
    options: {},
    $: t => self[t],
    set_unit: t => C.unit=t,
    set_perspective: t => viewport.style.perspective=`${t}${C.unit}`,

    // Initialize an object's properties
    init: t => {
      t.css||(t.css=""),
      t.html||(t.html=""),
      t.g||(t.g="scene"),
      t.o||(t.o="center center"),
      /*t.o=="top left"&&(t.x+=t.w/2,t.y+=t.h/2),
      t.o=="top"&&(t.y+=t.h/2),
      t.o=="top right"&&(t.x-=t.w/2,t.y+=t.h/2),
      t.o=="right"&&(t.x-=t.w/2),
      t.o=="bottom right"&&(t.x-=t.w/2,t.y-=t.h/2),
      t.o=="bottom"&&(t.y-=t.h/2),
      t.o=="bottom left"&&(t.x+=t.w/2,t.y-=t.h/2),
      t.o=="left"&&(t.x+=t.w/2),*/
      t.w||(t.w=0),
      t.h||(t.h=0),
      t.x||(t.x=0),
      t.y||(t.y=0),
      t.z||(t.z=0),
      t.rx||(t.rx=0),
      t.ry||(t.ry=0),
      t.rz||(t.rz=0),
      t.sx||(t.sx=1),
      t.sy||(t.sy=1),
      t.sz||(t.sz=1),
      C.options[t.n]=t
    },

    // Group of objects
    /*group: t => { 
      t.d||t.d===0||(t.d=t.h),
      C.init(t),
      C.$(t.g).innerHTML+=`<div id="${t.n}"class="group ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.d}${C.unit};transform:${C.tr(t)}">`
    },*/

    // Plane
    plane: t => {
      t.n||(t.n=`plane${C.plane_count++}`),
      C.init(t),
      C.$(t.g).innerHTML+=`<div id="${t.n}"class="plane ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.h}${C.unit};background:${t.b};transform-origin:${t.o};transform:${C.tr(t)}">${t.html}`,
      C.camera()
    },

    // Sprite (optional)
    sprite: t => {
      t.n||(t.n=`sprite${C.sprite_count++}`),
      C.init(t),
      C.$(t.g).innerHTML+=`<div id="${t.n}"class="sprite ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.h}${C.unit};background:${t.b};transform-origin:${t.o};transform:${C.tr(t)}">${t.html}`,
      C.sprites.push(t.n),
      C.camera()
    },

    // Move the camera
    camera: t => {
      t&&(t.x||0===t.x)&&(C.camX=t.x),
      t&&(t.y||0===t.y)&&(C.camY=t.y),
      t&&(t.z||0===t.z)&&(C.camZ=t.z),
      t&&(t.rx||0===t.rx)&&(C.camRX=t.rx),
      t&&(t.ry||0===t.ry)&&(C.camRY=t.ry),
      t&&(t.rz||0===t.rz)&&(C.camRZ=t.rz),
      C.camX+=(Math.random()-.5)/1e3,
      scene.style.transform=`translateX(${-C.camX}${C.unit})translateY(${-C.camY}${C.unit})translateZ(${-C.camZ}${C.unit})rotateX(${C.camRX}deg)rotateY(${C.camRY}deg)rotateZ(${C.camRZ}deg)`;
      for(var r in C.sprites){
        var n=C.$(C.sprites[r]),
        o=n.style.transform.replace(/ *rotate.*\(.*?deg\)/g,"");
        n.style.transform=o+`rotateZ(${-C.camRZ}deg)rotateX(${-C.camRX}deg)`
      }
    },

    // Move an object
    move: t => {
      if(t.n){
       var r=C.$(t.n),
       n=C.options[t.n];
       (t.x||0===t.x)&&(n.x=t.x),
       (t.y||0===t.y)&&(n.y=t.y),
       (t.z||0===t.z)&&(n.z=t.z),
       (t.rx||0===t.rx)&&(n.rx=t.rx),
       (t.ry||0===t.ry)&&(n.ry=t.ry),
       (t.rz||0===t.rz)&&(n.rz=t.rz),
       C.options[t.n]=n,
       r.style.transform=C.tr(n)
     }
    },

    // CSS3D transform string
    tr: t => `translateX(-50%)translateY(-50%)translateX(${t.x}${C.unit})translateY(${t.y}${C.unit})translateZ(${t.z}${C.unit})rotateX(${t.rx}deg)rotateY(${t.ry}deg)rotateZ(${t.rz}deg)scaleX(${t.sx})scaleY(${t.sy})scaleZ(${t.sz})`

  }

  // Sound player
  py = (f,r,A,m,b,i,s) => {
    A=new AudioContext()
    m=A.createBuffer(1,96e3,48e3)
    b=m.getChannelData(0)
    for(i=96e3;i--;)b[r?20000-i:i]=f(i)
    s=A.createBufferSource()
    s.buffer=m
    s.connect(A.destination)
    s.start()
  }

  t=(i,n)=>(n-i)/n;

  // Thunder sound
  thu = (i,q,n) => {
    n=25000;
    if (i > n) return null;
    return Math.sin(i/200 - Math.sin(i/331)*Math.sin(i/61) + Math.sin(Math.sin(i/59)/39) * 33)*t(i,n)*2;
  }
  
  // bubble sound
  bub = i => {
    let n = 7000;
    if (i > n) return null;
    let q = t(i, n);
    return Math.sin(i / (60 - (i / 180))) * (q ** 1.5);
  }
  
  // bowl sound
  tung = i => Math.sin(i / 30) * Math.sin(i * 0.07) * Math.exp(-i/6000)
  
  // splash
  splash = i => (Math.random() * 2 - 1) * Math.sin(i/50) * Math.exp(-i/10000) / 7;
  
  // taktak beavy sound
  taktak = i => {

    const n = 40000;
    if (i > n) return null;

    const x = i % 3100;

    const hit =
        Math.exp(-x*x/2300);

    return (
        Math.sin(
            i / 48000 * Math.PI * 2 * 1800
        ) +
        Math.sin(
            i / 48000 * Math.PI * 2 * 2700
        ) * .3
    ) * hit * t(i,n) * .5;
  }
  
  // boat sound
  buu = i => {
    let n = 40000;
    if (i > n) return null;
    let q = t(i, n);
    let env = Math.sin(i / 12700); // fade in/out
    let horn = Math.sin(i / 110) + 0.5 * Math.sin(i / 55);
    return horn * env * 0.8;
  }
  
  // grow sound
  puit = i => {
    let n = 24000;
    if (i > n) return null;
    let q = t(i, n);
    let f = 40 - (i / 800);
    return Math.sin(i / f) * Math.sin(i / 600) * q;
  }

  // draw sound
  zuzu = i => {
    var n=8e4;
    if (i > n) return null;
    var q = t(i,n);
    return Math.sin(i*0.001*Math.sin(0.0009*i+Math.sin(i/200)))*q/20;
  }
  
  // crayon path
  drawCrayon = (x1, y1, x2, y2, width, color, ctx = a.getContext("2d")) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (!len) return;

      const ux = dx / len;
      const uy = dy / len;
      const nx = -uy;
      const ny = ux;

      // Hash déterministe
      const hash = n => {
          n = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return n - Math.floor(n);
      };

      ctx.save();
      ctx.lineCap = "round";

      // --------------------------------------------------
      // 1. Beaucoup de petites marques de crayon
      // --------------------------------------------------

      const density = width * len * .55;

      for (let i = 0; i < density; i++) {

          // Position déterministe sur le trait
          const t = hash(i * 13.17 + x1 * .31 + y1 * .17);
          const d = t * len;

          const x = x1 + ux * d;
          const y = y1 + uy * d;

          // Distribution vers les bords du crayon
          const side = (hash(i * 7.31 + x1) - .5) * width;

          const px = x + nx * side;
          const py = y + ny * side;

          // Certaines marques sont presque invisibles
          const opacity = .025 + hash(i * 19.73) * .13;

          // Longueur de la "fibre"
          const l = .5 + hash(i * 23.91) * 5;

          // Largeur minuscule
          ctx.lineWidth = .25 + hash(i * 31.17) * .8;
          ctx.globalAlpha = opacity;
          ctx.strokeStyle = color;

          ctx.beginPath();
          ctx.moveTo(
              px - ux * l,
              py - uy * l
          );
          ctx.lineTo(
              px + ux * l,
              py + uy * l
          );
          ctx.stroke();
      }

      // --------------------------------------------------
      // 2. Quelques passages plus denses
      // --------------------------------------------------

      for (let pass = 0; pass < 5; pass++) {

          ctx.globalAlpha = .035 + hash(pass * 71.3) * .045;
          ctx.lineWidth = width * (.25 + hash(pass * 17.2) * .35);
          ctx.strokeStyle = color;

          const o = (hash(pass * 43.7) - .5) * width;

          ctx.beginPath();

          ctx.moveTo(
              x1 + nx * o,
              y1 + ny * o
          );

          // Trait légèrement irrégulier
          const mx =
              (x1 + x2) * .5 +
              nx * o +
              (hash(pass * 91.2) - .5) * width * .4;

          const my =
              (y1 + y2) * .5 +
              ny * o +
              (hash(pass * 37.8) - .5) * width * .4;

          ctx.quadraticCurveTo(
              mx, my,
              x2 + nx * o,
              y2 + ny * o
          );

          ctx.stroke();
      }

      ctx.restore();
  }

  // create img from paths
  createDrawing = (paths = [{x:1, y:1},{x:100,y:100}], color="#e4cb07") => {
    tmp.width ^= 0;

          f.translate(240,-270+ghY*3.5+s3oy*2+(frame-50)*2.5);
        }
        else if(story3 == 4 && frame >= 150){
          f.translate(240,-270+ghY*3.5+s3oy*2 + 250);
        }
        else {
          f.translate(240,-270+ghY*3.5+s3oy*2);
        }
        
        f.scale(.5,.5);
        f.drawImage(purple, 0, 0);
        f.restore();
      }
      
      // chick
      if(story3 >= 2){
        f.font = "80px emoji";
        f.save();
        f.scale(1,1);
        if(story3 == 4 && frame >= 50 && frame < 150){
          f.translate(190,-175+ghY*3.5+s3oy*2+(frame-50)*2.5);
        }
        else if(story3 == 4 && frame >= 150){
          f.translate(190,-175+ghY*3.5+s3oy*2+250);
        }
        else {
          f.translate(190,-175+ghY*3.5+s3oy*2);
        }
        f.fillText("🐤", 0, 0);
        f.restore();
      }
      
      // flowers
      if(story3 >= 4){
        f.save();
        if(story3 == 4 && frame >= 50 && frame < 150){
          f.globalAlpha = (frame - 50) / 100;
        }
        else if(story3 == 4 && frame < 50){
          f.globalAlpha = 0;
        }
        else f.globalAlpha = 1;
        for(i of flowers){
          f.save();
          f.translate(i.x-50, i.y);
          f.scale(.2, .2);
          f.drawImage(imgflower, 0, 0);
          f.restore();
        }
        f.restore();
      }
    }
    
    else if(story3 >= 5){
    
      // chick
      f.font = "80px emoji";
      f.save();
      if(story3 == 5 && frame < 230){
        f.translate(220 + frame * 1.5 ,290 - Math.abs(Math.cos(frame/10)*15));
      }
      else {
        f.translate(220 + 230 * 1.5 ,290 - Math.abs(Math.cos(230/10)*15));
      }
      f.scale(-1,1);
      f.fillText("🐤", 0, 0);
      f.restore();
      
      // indigo
      f.save();
      f.translate(630,140);
      f.rotate(.2);
      f.scale(.7,.7);
      f.drawImage(indigo, 0, 0);
      f.restore();
      
      // goose
      f.font = "150px emoji";
      f.save();
      f.translate(520,270);
      f.scale(1,1);
      f.fillText("🪿", 0, 0);
      f.restore();
      
      // grass
      for(var i of patches){
        f.save();
        f.translate(i.x-1900, i.y);
        f.scale(.2, .2);
        f.globalAplha = 1;
        f.drawImage(imgpatch, 0, 0);
        f.restore();
      }
      
      // flowers
      for(var i of flowers){
        f.save();
        f.translate(700-i.x, i.y+30);
        f.scale(.2, .2);
        f.globalAplha = 1;
        f.drawImage(imgflower, 0, 0);
        f.restore();
      }
    }
    
    // unicorn head
    f.font = "150px emoji";
    f.save();
    f.translate(196+uoffsetx,200+uoffsety);
    f.scale(-1.2,1.2);
    f.fillText("🦄", 0, 0 + Math.sin(frame/20)*4);
    f.restore();
  }
}
