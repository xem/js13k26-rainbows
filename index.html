<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<div id=viewport>
  <div id=rainbow><div></div></div>
  <div id=camera>
    <div id=scene></div>
  </div>
  <div id=sun></div>
  <div id=fade></div>
  <div id=hud>
    <div id=unicorn>🦄</div>
    <div id=crayon1>🖍️</div>
    <div id=crayon2>🖍️</div>
    <div id=crayon3>🖍️</div>
    <button id=prologue>Prologue</button>
    <button id=play>Play</button>
  </div>
  <div id=title>Unicorny and the Mystery of the<br>Amazing Rainbow Crayons<br>which have Unfortunately Disappeared<br> from its Enchanted Island !</div>
</div>

<script>
C = {
unit: "px",
camX: 0,
camY: 0,
camZ: 0,
camRX: 0,
camRY: 0,
camRZ: 0,
sprite_count: 0,
sprites: [],
plane_count: 0,
cube_count: 0,
pyramid_count: 0,
options: {},
$: t => self[t],
set_unit: t => C.unit=t,
set_perspective: t => viewport.style.perspective=`${t}${C.unit}`,

// Initialize an object's properties
init: t => {
  t.css||(t.css=""),
  t.html||(t.html=""),
  t.g||(t.g="scene"),
  t.o||(t.o="center center"),
  t.o=="top left"&&(t.x+=t.w/2,t.y+=t.h/2),
  t.o=="top"&&(t.y+=t.h/2),
  t.o=="top right"&&(t.x-=t.w/2,t.y+=t.h/2),
  t.o=="right"&&(t.x-=t.w/2),
  t.o=="bottom right"&&(t.x-=t.w/2,t.y-=t.h/2),
  t.o=="bottom"&&(t.y-=t.h/2),
  t.o=="bottom left"&&(t.x+=t.w/2,t.y-=t.h/2),
  t.o=="left"&&(t.x+=t.w/2),
  t.w||(t.w=0),
  t.h||(t.h=0),
  t.x||(t.x=0),
  t.y||(t.y=0),
  t.z||(t.z=0),
  t.rx||(t.rx=0),
  t.ry||(t.ry=0),
  t.rz||(t.rz=0),
  t.sx||(t.sx=1),
  t.sy||(t.sy=1),
  t.sz||(t.sz=1),
  C.options[t.n]=t
},

// Group of objects
group: t => { 
  t.d||t.d===0||(t.d=t.h),
  C.init(t),
  C.$(t.g).innerHTML+=`<div id="${t.n}"class="group ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.d}${C.unit};transform:${C.tr(t)}">`
},

// Plane
plane: t => {
  t.n||(t.n=`plane${C.plane_count++}`),
  C.init(t),
  C.$(t.g).innerHTML+=`<div id="${t.n}"class="plane ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.h}${C.unit};background:${t.b};transform-origin:${t.o};transform:${C.tr(t)}">${t.html}`,
  C.camera()
},

// Sprite (optional)
sprite: t => {
  t.n||(t.n=`sprite${C.sprite_count++}`),
  C.init(t),
  C.$(t.g).innerHTML+=`<div id="${t.n}"class="sprite ${t.css}"style="position:absolute;width:${t.w}${C.unit};height:${t.h}${C.unit};background:${t.b};transform-origin:${t.o};transform:${C.tr(t)}">${t.html}`,
  C.sprites.push(t.n),
  C.camera()
},

// Cube (optional)
cube: t => {
  t.n||(t.n=`cube${C.cube_count++}`),
  C.init(t),
  C.group(t),
  C.plane({g:t.n,x:t.w/2,y:t.d/2,w:t.w,h:t.d,b:t.b,css:"bottom"}),
  C.plane({g:t.n,y:t.d/2,w:t.d,h:t.h,b:t.b1||t.b,rx:-90,ry:-90,o:"bottom",css:"left"}),
  C.plane({g:t.n,x:t.w,y:t.d/2,w:t.d,h:t.h,b:t.b2||t.b,rx:-90,ry:-90,o:"bottom",css:"right"}),
  C.plane({g:t.n,x:t.w/2,y:t.d,w:t.w,h:t.h,b:t.b1||t.b,rx:-90,o:"bottom",css:"front"}),
  C.plane({g:t.n,x:t.w/2,y:0,w:t.w,h:t.h,b:t.b2||t.b,rx:-90,o:"bottom",css:"back"}),
  C.plane({g:t.n,x:t.w/2,y:t.d/2,z:t.h,w:t.w,h:t.d,b:t.b,css:"top"})
},

// Pyramid (optional)
pyramid: t => {
  t.n||(t.n=`pyramid${C.pyramid_count++}`),
  C.init(t),
  C.group({n:t.n,g:t.g,x:t.x,y:t.y,z:t.z,w:100,d:100,rx:t.rx,ry:t.ry,rz:t.rz,sx:t.w/100,sy:t.d/100,sz:t.h/86.6025,css:t.css}),
  C.plane({g:t.n,x:50,y:50,w:100,h:100,b:t.b,css:"bottom"}),
  C.plane({g:t.n,y:50,w:100,h:100,b:t.b,ry:-60,rz:90,css:"triangle left",o:"bottom"}),
  C.plane({g:t.n,x:100,y:50,w:100,h:100,b:t.b2||t.b,ry:-120,rz:90,css:"triangle right",o:"bottom"}),
  C.plane({g:t.n,x:50,y:0,w:100,h:100,b:t.b,rx:-120,css:"triangle back",o:"bottom"}),
  C.plane({g:t.n,x:50,y:100,w:100,h:100,b:t.b1||t.b,rx:-60,css:"triangle front",o:"bottom"})
},

// Move the camera
camera: t => {
  t&&(t.x||0===t.x)&&(C.camX=t.x),
  t&&(t.y||0===t.y)&&(C.camY=t.y),
  t&&(t.z||0===t.z)&&(C.camZ=t.z),
  t&&(t.rx||0===t.rx)&&(C.camRX=t.rx),
  t&&(t.ry||0===t.ry)&&(C.camRY=t.ry),
  t&&(t.rz||0===t.rz)&&(C.camRZ=t.rz),
  C.camX+=(Math.random()-.5)/1e3,
  scene.style.transform=`translateX(${-C.camX}${C.unit})translateY(${-C.camY}${C.unit})translateZ(${-C.camZ}${C.unit})rotateX(${C.camRX}deg)rotateY(${C.camRY}deg)rotateZ(${C.camRZ}deg)`;
  for(var r in C.sprites){
    var n=C.$(C.sprites[r]),
    o=n.style.transform.replace(/ *rotate.*\(.*?deg\)/g,"");
    n.style.transform=o+`rotateZ(${-C.camRZ}deg)rotateX(${-C.camRX}deg)`
  }
},

// Move an object
move: t => {
  if(t.n){
   var r=C.$(t.n),
   n=C.options[t.n];
   (t.x||0===t.x)&&(n.x=t.x),
   (t.y||0===t.y)&&(n.y=t.y),
   (t.z||0===t.z)&&(n.z=t.z),
   (t.rx||0===t.rx)&&(n.rx=t.rx),
   (t.ry||0===t.ry)&&(n.ry=t.ry),
   (t.rz||0===t.rz)&&(n.rz=t.rz),
   C.options[t.n]=n,
   r.style.transform=C.tr(n)
 }
},

// CSS3D transform string
tr: t => `translateX(-50%)translateY(-50%)translateX(${t.x}${C.unit})translateY(${t.y}${C.unit})translateZ(${t.z}${C.unit})rotateX(${t.rx}deg)rotateY(${t.ry}deg)rotateZ(${t.rz}deg)scaleX(${t.sx})scaleY(${t.sy})scaleZ(${t.sz})`

}

    for (let i = 0; i < count; i++) {

            attempts++;

            // Évite de boucler indéfiniment si le cercle est trop rempli
            if (attempts > 1000) {

        } while (

    return items;
}*/
</script>

<script>
C.plane({n:"island",w:400,h:400,css:"circle island"});

items = [{"x":-121,"y":22},{"x":65,"y":-116},{"x":-15,"y":121},{"x":68,"y":-40},{"x":-69,"y":-75},{"x":91,"y":147},{"x":-170,"y":-54},{"x":61,"y":84},{"x":-5,"y":13},{"x":-7,"y":167},{"x":21,"y":68},{"x":-50,"y":79},{"x":-163,"y":71},{"x":37,"y":30},{"x":20,"y":-110},{"x":29,"y":113},{"x":119,"y":84},{"x":-72,"y":-122},{"x":9,"y":140},{"x":-115,"y":-120},{"x":95,"y":26},{"x":-87,"y":9},{"x":167,"y":-13},{"x":-148,"y":-13},{"x":-50,"y":41}];

for(i = 0; i < 20; i++){
  x = items[i].x;
  y = items[i].y;
  if(i == 0){
    C.sprite({x,y,w:90,h:120,rx:90,html:"<div>🦒",css:"e big animal"});
    C.plane({x,y,w:90,h:120,rx:0,html:"🦒",css:"e big animal shadow"});
  }
  else if(i < 5){
    C.sprite({x,y,w:90,h:120,rx:90,html:[..."🌴🌳"][rand=Math.random()*2|0],css:"e tree"});
    C.plane({x,y,w:90,h:120,rx:0,html:[..."🌴🌳"][rand],css:"e tree shadow"});
  }
  else if(i <= 8){
    C.sprite({x,y,w:30,h:70,rx:90,html:("<div>"+[..."🐒🐢️🐇"][8-i]),css:"e animal"});
    C.plane({x,y,w:30,h:70,rx:0,html:[..."🐒🐖️🐇"][8-i],css:"e animal shadow"});
  }
  else {
    C.sprite({x,y,w:20,h:45,rx:90,html:[..."🌻🌹🌻🌷🌼️"][i%5],css:"e flower"});
  }
}
C.sprite({x:300,y:10,w:90,h:40,rx:90,html:"<div>🐋",css:"e big animal"});
C.plane({x:30,y:220,z:140,w:90,h:40,rx:-70,html:"<div id=b2>🕊️",css:"e animal bird"});
C.camera({z:-500,y:-60,rx:70,rz:200-45});
rz = 20;
setTimeout("C.camera({rz});",10);
setInterval("rz+=45;C.camera({rz})",2000);
onload = () => {
  document.body.insertAdjacentHTML("beforeEnd","<style>#scene , .sprite, .shadow { transition: 2s linear }");
  fade.style.transition = "background 2s";
  setTimeout(()=>{
    title.style.top = "0px";
    title.style.lineHeight = "35px";
    fade.style.background = "#fff1";
    C.camera({z:-160});
  }, 2000);
  setTimeout(()=>{
    hud.style.top = "0px";
  }, 11000);
}

prologue.onclick = () => location = "prologue.html";
play.onclick = () => {
  fade.style.background = "#000";
  hud.style.top = "400px";
  setTimeout(()=>{
    location = "game.html";
    title.style.top = "-500px";
  }, 3000);
}
</script>
